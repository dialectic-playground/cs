# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# NuGet: one entry per implemented project (packages.lock.json is committed).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (.NET 10 (LTS)) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: nuget
    directory: /00-hello-world/src
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Hook revisions in .pre-commit-config.yaml (enforced by the pre-commit CI job).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ci
